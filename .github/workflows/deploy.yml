name: Deploy Arckenites
on:
  push:
    branches:
      - main
  workflow_dispatch:


jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e

            cd /opt/arckenites

            git fetch origin main
            git reset --hard origin/main

            cd /opt/arckenites/backend

            /opt/arckenites/backend/venv/bin/pip install -r requirements.txt

            /opt/arckenites/backend/venv/bin/alembic upgrade head

            sudo systemctl restart arckenites-backend

            sudo systemctl is-active --quiet arckenites-backend

            curl -fsS http://127.0.0.1:8000/api/health
