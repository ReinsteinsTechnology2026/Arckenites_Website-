name: Deploy Arckenites

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Deploy application
        # Run a copy of the script, never the file in the repository. The
        # script runs `git reset --hard`, which rewrites /opt/arckenites/deploy.sh
        # while bash is still reading it. The copy is not part of that reset.
        run: cp /opt/arckenites/deploy.sh /tmp/deploy.sh && bash /tmp/deploy.sh
