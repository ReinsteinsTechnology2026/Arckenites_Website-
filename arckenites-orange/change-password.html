<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Change Password | Arckenites</title>
<meta name="robots" content="noindex, nofollow">

<link rel="icon" href="assets/favicon.png" type="image/png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link rel="stylesheet" href="css/style.css">

</head>
<body>

<header class="page-hero text-center">
  <div class="hero-bg"></div>
  <div class="container">
    <div class="breadcrumb-custom"><a href="index.html">Home</a><span>/</span><span>Change Password</span></div>
    <h1>Set a New Password</h1>
    <p>Your account was created with a temporary password. Choose a new one to continue.</p>
  </div>
</header>

<section class="content-section">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-5 col-md-7">
        <div class="form-card">
          <div class="course-icon mx-auto mb-3"><i class="fa-solid fa-key"></i></div>
          <h5 class="mb-3 text-center">Change Password</h5>
          <form id="changePasswordForm" novalidate>
            <div class="row g-3">
              <div class="col-12"><label class="form-label">Current Password</label><input type="password" class="form-control" id="currentPassword" autocomplete="current-password" required></div>
              <div class="col-12"><label class="form-label">New Password</label><input type="password" class="form-control" id="newPassword" autocomplete="new-password" minlength="8" required></div>
              <div class="col-12"><label class="form-label">Confirm New Password</label><input type="password" class="form-control" id="confirmPassword" autocomplete="new-password" minlength="8" required></div>
              <div class="col-12 login-error" id="changePasswordError" style="display:none;"></div>
              <div class="col-12"><button type="submit" class="btn btn-accent w-100">Update Password</button></div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>

<script src="js/api.js?v=1"></script>
<script src="js/auth.js?v=1"></script>
<script src="js/change-password.js?v=1"></script>

</body>
</html>
