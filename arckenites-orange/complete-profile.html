<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Complete Your Profile | Arckenites</title>
<meta name="robots" content="noindex, nofollow">

<link rel="icon" href="assets/favicon.png" type="image/png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link rel="stylesheet" href="css/style.css">

</head>
<body>

<header class="page-hero text-center">
  <div class="hero-bg"></div>
  <div class="container">
    <div class="breadcrumb-custom"><a href="index.html">Home</a><span>/</span><span>Complete Your Profile</span></div>
    <h1>Welcome to Arckenites</h1>
    <p>One last step — tell us a bit about yourself before you enter your dashboard.</p>
  </div>
</header>

<section class="content-section">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-6 col-md-8">
        <div class="form-card">
          <div class="course-icon mx-auto mb-3"><i class="fa-solid fa-id-card"></i></div>
          <h5 class="mb-3 text-center">Your Details</h5>
          <form id="completeProfileForm" novalidate>
            <div class="row g-3">
              <div class="col-12">
                <label class="form-label">Name</label>
                <input type="text" class="form-control" id="profileName" required>
              </div>
              <div class="col-12">
                <label class="form-label">Mobile Number</label>
                <input type="tel" class="form-control" id="profileMobile" required>
              </div>
              <div class="col-12">
                <label class="form-label">Mail ID</label>
                <input type="email" class="form-control" id="profileEmail" required>
              </div>
              <div class="col-12">
                <label class="form-label">Current Role</label>
                <div class="role-toggle" id="roleToggle">
                  <button type="button" class="role-toggle-btn" data-value="student">Student</button>
                  <button type="button" class="role-toggle-btn" data-value="employer">Employer</button>
                </div>
              </div>
              <div class="col-12">
                <label class="form-label">Program</label>
                <select class="form-select" id="profileProgram" required>
                  <option value="" selected disabled>Choose your program&hellip;</option>
                </select>
              </div>
              <div class="col-12 login-error" id="completeProfileError" style="display:none;"></div>
              <div class="col-12"><button type="submit" class="btn btn-accent w-100">Continue to Dashboard</button></div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>

<script src="js/api.js?v=1"></script>
<script src="js/auth.js?v=1"></script>
<script src="js/complete-profile.js?v=1"></script>

</body>
</html>
