services:
  - type: web
    name: arckenites-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Migrations run on every deploy/restart (safe — Alembic no-ops if already
    # up to date). seed.py is deliberately NOT run here: it resets the two
    # bootstrap admin passwords back to SEED_ADMIN*_PASSWORD every time it
    # runs, which would silently undo any password an admin later changed.
    # Run it once manually via the Render Shell after the first deploy.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: arckenites-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_TTL_MIN
        value: "60"
      - key: ENV
        value: production
      # Update this after the frontend is deployed to Vercel — it must list
      # the exact Vercel URL(s) the frontend is served from, comma-separated.
      - key: CORS_ORIGINS
        value: http://localhost:5500,http://127.0.0.1:5500
      - key: SEED_ADMIN1_USERNAME
        value: akadmin@001
      - key: SEED_ADMIN1_PASSWORD
        generateValue: true
      - key: SEED_ADMIN2_USERNAME
        value: akadmin@002
      - key: SEED_ADMIN2_PASSWORD
        generateValue: true

databases:
  - name: arckenites-db
    plan: free
